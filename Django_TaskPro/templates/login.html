{% extends 'base.html' %}

{% block title %}Sign In - TaskPro{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 via-indigo-50 to-slate-100">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        
        <!-- App Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-200 mb-3">
                <i class="fa-solid fa-list-check text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Welcome to TaskPro</h1>
            <p class="text-slate-500 text-sm mt-1">Sign in to organize and manage your tasks</p>
        </div>

        <!-- Alert Banner -->
        <div id="login-alert" class="hidden mb-5 p-4 rounded-xl text-sm font-medium flex items-center gap-3">
            <i id="login-alert-icon" class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
            <span id="login-alert-message"></span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">
                    Username
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        autocomplete="username"
                        placeholder="Enter your username"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-slate-800 placeholder-slate-400"
                    >
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600">
                        Password
                    </label>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        class="w-full pl-10 pr-11 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-slate-800 placeholder-slate-400"
                    >
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility('password', 'toggle-pwd-icon')"
                        class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600"
                    >
                        <i id="toggle-pwd-icon" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button 
                type="submit" 
                id="submit-btn"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium text-sm rounded-xl shadow-md shadow-indigo-200 hover:shadow-indigo-300 transition-all flex items-center justify-center gap-2"
            >
                <span id="btn-text">Sign In</span>
                <i id="btn-spinner" class="hidden fa-solid fa-circle-notch fa-spin"></i>
            </button>
        </form>

        <!-- Footer Links -->
        <div class="mt-6 text-center text-sm text-slate-500">
            Don't have an account? 
            <a href="/register/" class="font-semibold text-indigo-600 hover:text-indigo-700 hover:underline">
                Create one now
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    // Redirect if already authenticated
    if (api.isAuthenticated()) {
        window.location.replace("/dashboard/");
    }

    function togglePasswordVisibility(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.replace("fa-eye-slash", "fa-eye");
        }
    }

    function showAlert(message, isError = true) {
        const alertBox = document.getElementById("login-alert");
        const alertMessage = document.getElementById("login-alert-message");
        const alertIcon = document.getElementById("login-alert-icon");

        alertBox.className = isError 
            ? "mb-5 p-4 rounded-xl text-sm font-medium flex items-center gap-3 bg-red-50 text-red-700 border border-red-200"
            : "mb-5 p-4 rounded-xl text-sm font-medium flex items-center gap-3 bg-emerald-50 text-emerald-700 border border-emerald-200";

        alertIcon.className = isError 
            ? "fa-solid fa-circle-exclamation flex-shrink-0 text-red-500"
            : "fa-solid fa-circle-check flex-shrink-0 text-emerald-500";

        alertMessage.textContent = message;
        alertBox.classList.remove("hidden");
    }

    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const btnText = document.getElementById("btn-text");
        const btnSpinner = document.getElementById("btn-spinner");
        const submitBtn = document.getElementById("submit-btn");

        if (!username || !password) {
            showAlert("Please enter both username and password.");
            return;
        }

        // Show loading state
        submitBtn.disabled = true;
        btnText.textContent = "Signing In...";
        btnSpinner.classList.remove("hidden");
        document.getElementById("login-alert").classList.add("hidden");

        try {
            const res = await api.login(username, password);
            if (res.ok) {
                showAlert("Login successful! Redirecting...", false);
                api.showToast("Signed in successfully!", "success");
                setTimeout(() => {
                    window.location.replace("/dashboard/");
                }, 400);
            } else {
                let msg = "Invalid credentials. Please verify your username and password.";
                if (res.data && res.data.detail) {
                    msg = res.data.detail;
                }
                showAlert(msg, true);
            }
        } catch (err) {
            showAlert("Unable to connect to server. Please try again later.", true);
        } finally {
            submitBtn.disabled = false;
            btnText.textContent = "Sign In";
            btnSpinner.classList.add("hidden");
        }
    }
</script>
{% endblock %}
