<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskPro | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0 p-4" style="max-width:430px;width:100%">
      <h1 class="h3 mb-1">TaskPro</h1>
      <p class="text-secondary mb-4">Sign in to manage your tasks.</p>
      <div id="message" class="alert d-none"></div>
      <form id="loginForm">
        <label class="form-label" for="username">Username</label>
        <input class="form-control mb-3" id="username" required autocomplete="username">
        <label class="form-label" for="password">Password</label>
        <input class="form-control mb-3" id="password" type="password" required autocomplete="current-password">
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      <p class="mt-3 mb-0 text-center">New to TaskPro? <a href="/register/">Create account</a></p>
    </div>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
