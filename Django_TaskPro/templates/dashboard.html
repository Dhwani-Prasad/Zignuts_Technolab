<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskPro | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/dashboard/">TaskPro</a>
      <button id="logoutButton" class="btn btn-outline-light btn-sm">Logout</button>
    </div>
  </nav>
  <main class="container py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
      <div><h1 class="h3 mb-1">My tasks</h1><p class="text-secondary mb-0">Plan your day, one task at a time.</p></div>
      <button id="newTaskButton" class="btn btn-primary">+ Add task</button>
    </div>
    <div id="message" class="alert d-none"></div>
    <section id="taskFormPanel" class="card border-0 shadow-sm mb-4 d-none">
      <div class="card-body">
        <h2 id="formHeading" class="h5 mb-3">Add task</h2>
        <form id="taskForm">
          <input id="taskId" type="hidden">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="title">Title</label>
              <input id="title" class="form-control" maxlength="200" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="due_date">Due date</label>
              <input id="due_date" type="date" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="priority">Priority</label>
              <select id="priority" class="form-select">
                <option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="is_completed">Status</label>
              <select id="is_completed" class="form-select">
                <option value="false">Pending</option><option value="true">Completed</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="description">Description</label>
              <textarea id="description" class="form-control" rows="3"></textarea>
            </div>
          </div>
          <div class="d-flex gap-2 mt-3">
            <button class="btn btn-primary" type="submit">Save task</button>
            <button class="btn btn-outline-secondary" id="cancelEditButton" type="button">Cancel</button>
          </div>
        </form>
      </div>
    </section>
    <section class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-md-5"><input id="searchInput" class="form-control" placeholder="Search title or description"></div>
          <div class="col-md-3">
            <select id="statusFilter" class="form-select">
              <option value="all">All tasks</option><option value="pending">Pending</option><option value="completed">Completed</option>
            </select>
          </div>
          <div class="col-md-2">
            <select id="priorityFilter" class="form-select">
              <option value="">All priorities</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option>
            </select>
          </div>
          <div class="col-md-2">
            <select id="sortFilter" class="form-select">
              <option value="due_date">Due date ↑</option><option value="-due_date">Due date ↓</option>
            </select>
          </div>
        </div>
        <div id="taskList" class="row g-3"></div>
      </div>
    </section>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
