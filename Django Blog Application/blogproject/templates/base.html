<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Blog{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    input:not([type="checkbox"]):not([type="radio"]),
    select,
    textarea {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ced4da;
      border-radius: 0.375rem;
    }

    input[type="checkbox"],
    input[type="radio"] {
      width: auto;
    }

    ul.errorlist {
      color: #dc3545;
      padding-left: 1.25rem;
    }
  </style>

</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">My Blog</a>

      <div class="d-flex align-items-center gap-3">
        {% if user.is_authenticated %}
        <span class="text-white">Hi, {{ user.username }}</span>
        <a class="btn btn-success btn-sm" href="{% url 'post_create' %}">Write Post</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
        </form>
        {% else %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
        <a class="btn btn-success btn-sm" href="{% url 'signup' %}">Sign Up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>

</body>

</html>
